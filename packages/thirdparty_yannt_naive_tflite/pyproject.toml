[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thirdparty-yannt-naive-tflite"
description = "Yannt Naive TFlite Parsing"
# Note: No idea the real version required at this time.
requires-python = ">=3.9"

dependencies = ["tflite", "flatbuffers"]

# Requires PEP 621 (setuptools>=61)
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[project.entry-points."naive_command"]

# Register onnx as a pparse subcommand
tflite = "thirdparty.yannt.naive.tflite.main:register_naive_tflite"

