[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thirdparty-yannt-naive-onnx"
description = "Naive Model Parsing dfg"
# Note: No idea the real version required at this time.
requires-python = ">=3.9"

dependencies = ["onnx"]

# Requires PEP 621 (setuptools>=61)
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[project.entry-points."naive_command"]

# Register onnx as a pparse subcommand
onnx = "thirdparty.yannt.naive.onnx.main:register_naive_onnx"

