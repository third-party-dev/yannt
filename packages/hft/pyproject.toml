[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thirdparty-yannt-hft"
description = "Transformers CLI"
# Note: No idea the real version required at this time.
requires-python = ">=3.9"

dependencies = [
    "torch",
    "transformers",
    "onnx",
    # graph dependencies (consider new plugin?)
    "pydot", # need to also apt-get install graphviz
    "tabulate",
    "coverage",
]

# Requires PEP 621 (setuptools>=61)
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[project.scripts]
hft = "thirdparty.yannt.transformers.cli:main"



