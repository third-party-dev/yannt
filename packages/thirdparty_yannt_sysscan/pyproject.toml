[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thirdparty-yannt-sysscan"
description = "Sysscan CLI"
# Note: No idea the real version required at this time.
requires-python = ">=3.9"

dependencies = []

# Requires PEP 621 (setuptools>=61)
dynamic = ["version"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[project.entry-points."yannt_command"]
# Register pparse as a yannt subcommand
sysscan = "thirdparty.yannt.sysscan.yannt_plugin:register_yannt_sysscan"

[tool.setuptools.package-data]
"thirdparty.yannt.sysscan" = ["data/*.ids"]
