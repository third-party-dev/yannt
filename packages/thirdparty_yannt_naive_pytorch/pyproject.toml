[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thirdparty-yannt-naive-pytorch"
version = "0.0.1"
description = "Naive Model Parsing dfg"
# Note: No idea the real version required at this time.
requires-python = ">=3.9"

dependencies = ["torch"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[project.entry-points."naive_command"]

# Register pytorch as a pparse subcommand
pytorch = "thirdparty.yannt.naive.pytorch.main:register_naive_pytorch"

