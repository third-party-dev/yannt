[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thirdparty-yannt-naive-mnn"
version = "0.0.1"
description = "Yannt Naive MNN Parsing"
# Note: No idea the real version required at this time.
requires-python = ">=3.9"

dependencies = ["MNN"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[project.entry-points."naive_command"]

# Register onnx as a pparse subcommand
mnn = "thirdparty.yannt.naive.mnn.main:register_naive_mnn"

