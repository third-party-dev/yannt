# framework.register_factor(name, AnalysisFactor)
# framework.register_process(name, AnalysisProcess)
# framework.register_report(name, AnalysisReport)


[project.entry-points."yannt_analysis_plugin"]
analysis_plugin_pparse = "thirdparty.yannt.analysis.pparse.plugin:register_analysis_plugin"










