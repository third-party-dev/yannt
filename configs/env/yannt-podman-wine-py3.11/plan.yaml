config_root:
  alias: host
  builder: host
  platform: linux
  init: init-host.sh

  proj_path: { from: env, name: PROJ_PATH }
  config_path: { from: env, name: CONFIG_PATH }
  config_name: { from: env, name: CONFIG_NAME }

  py_ver: { from: env, name: PY_VER }
  env_name: { from: env, name: ENV_NAME }

  inner:
    # Name of folder
    alias: podman

    # Triggers builder class that will build target scripts
    builder: podman
    # inherited => platform: linux

    # What parent calls
    init: init-podman.sh
    run: run-podman.sh

    # unused; image: ubuntu:22.04

    extra_preapt_commands:
    - RUN dpkg --add-architecture i386

    apt_packages:
    - graphviz
    - flatbuffers-compiler
    - protobuf-compiler
    - cmake
    - build-essential
    - wine
    - wine32
    - wine64
    - wget
    - ca-certificates

    extra_podman_run_commands:
    - RUN wineboot --init
    - 'echo FETCH PYTHON: wget -O "${PROJ_PATH}/${CRI_HOME}/python-${PY_VER}-embed-amd64.zip" ${PYTHON_EMBED_ZIP_URL}'
    - '[ ! -e "${PROJ_PATH}/${CRI_HOME}/python-${PY_VER}-embed-amd64.zip" ] && wget -O "${PROJ_PATH}/${CRI_HOME}/python-${PY_VER}-embed-amd64.zip" ${PYTHON_EMBED_ZIP_URL}'
    - '[ ! -e "${PROJ_PATH}/${CRI_HOME}/get-pip.py" ] && wget -O "${PROJ_PATH}/${CRI_HOME}/get-pip.py" ${PYPA_GETPIP_URL}'
    - unzip -o "${PROJ_PATH}/${CRI_HOME}/python-${PY_VER}-embed-amd64.zip" -d "${PROJ_PATH}/${CRI_HOME}/.wine/drive_c/Python311/"
    - RUN wine ${CRI_PROJ_PATH}/${CRI_HOME}/.wine/drive_c/Python311/python.exe ${CRI_PROJ_PATH}/${CRI_HOME}/get-pip.py
    - echo sed -i 's/#import site/import site/' ${PROJ_PATH}/${CRI_HOME}/.wine/drive_c/Python311/python311._pth
    - sed -i 's/#import site/import site/' ${PROJ_PATH}/${CRI_HOME}/.wine/drive_c/Python311/python311._pth
    - RUN wine reg add 'HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Session Manager\Environment' /v Path /t REG_EXPAND_SZ /d 'C:\Python311;C:\Python311\Scripts' /f    
    - RUN wineserver --wait
    - RUN wine ${CRI_PROJ_PATH}/${CRI_HOME}/.wine/drive_c/Python311/python.exe -m pip install virtualenv

    cri_home: { from: env, name: CRI_HOME }
    cri_root: { from: env, name: CRI_ROOT }
    cri_bin: { from: env, name: CRI_BIN }
    cri_run: { from: env, name: CRI_RUN }
    cri_run_args: { from: env, name: CRI_RUN_ARGS }
    cri_proj_path: { from: env, name: CRI_PROJ_PATH }
    root_drive: { from: env, name: ROOT_DRIVE }
    pypa_getpip_url: { from: env, name: PYPA_GETPIP_URL }
    python_embed_zip_url: { from: env, name: PYTHON_EMBED_ZIP_URL }

    inner:
      alias: venv
      builder: venv
      platform: wine
      init: init-venv.sh
      run: run-venv.sh

      python: { from: env, name: SYSTEM_PYTHON }
      python_venv_prefix: { from: env, name: PYTHON_VENV_PREFIX }

      inner:
        alias: python
        builder: python
        init: init-python.sh
        run: run-python.sh

        root_drive: { from: env, name: ROOT_DRIVE }
        python_pkg_path: { from: env, name: PYTHON_PKG_PATH }
        python_autoinstall_path: { from: env, name: PYTHON_AUTOINSTALL_PATH }

        ps1_tag: { from: env, name: PS1_TAG }
        python: { from: env, name: VENV_PYTHON }
        pip_idx_args: { from: env, name: PIP_IDX_ARGS }
        pip_upstream_verifiers: { from: env, name: PIP_UPSTREAM_VERIFIERS }
        py_constraints: { from: env, name: PY_CONSTRAINTS }
        py_reqs: { from: env, name: PY_REQS }
        pkg_skip_list: { from: env, name: PKG_SKIP_LIST }

